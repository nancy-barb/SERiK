<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ŠEŘíK</title>
</head>

<body>

    <h1>Kudy k dalšímu stanovišti?</h1>

    <p id="status">GPS zatím není spuštěná.</p>

    <button id="startButton">Spustit GPS</button>

    <div id="position" style="display: none;">
        <p>
            Zeměpisná šířka:
            <strong id="latitude">–</strong>
        </p>

        <p>
            Zeměpisná délka:
            <strong id="longitude">–</strong>
        </p>

        <p>
            Přesnost:
            <strong id="accuracy">–</strong> m
        </p>
    </div>

    <div id="navigation" style="display: none;">
    <h2>Cíl</h2>
<div id="arrow"
     style="
        font-size: 100px;
        text-align: center;
        transition: transform 0.2s linear;
     ">
    ↑
</div>
    <p>
        Vzdálenost:
        <strong id="distance">–</strong> m
    </p>

    <p>
        Azimut:
        <strong id="bearing">–</strong>°
    </p>

   <p>
    Směr telefonu:
    <strong id="heading">–</strong>°
</p>
</div>

    <script>
        const startButton = document.getElementById("startButton");
        const status = document.getElementById("status");
        const position = document.getElementById("position");
        const navigation = document.getElementById("navigation");

        // Testovací cíl
        const target = {
            latitude: 49.9935189,
            longitude: 14.6600694
        };
let currentBearing = null;
let currentHeading = null;
        
        startButton.addEventListener("click", startGPS);

        function startGPS() {

            if (!navigator.geolocation) {
                status.textContent = "Tento telefon nepodporuje geolokaci.";
                return;
            }

            status.textContent = "Hledám polohu…";
startCompass();
            navigator.geolocation.watchPosition(
                updatePosition,
                positionError,
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 15000
                }
            );
        }

        function updatePosition(data) {

            const latitude = data.coords.latitude;
            const longitude = data.coords.longitude;

            document.getElementById("latitude").textContent =
                latitude.toFixed(6);

            document.getElementById("longitude").textContent =
                longitude.toFixed(6);

            document.getElementById("accuracy").textContent =
                Math.round(data.coords.accuracy);

            position.style.display = "block";
            status.textContent = "GPS aktivní.";

            updateDistance(latitude, longitude);
        }


        // Spočítá vzdálenost mezi dvěma GPS body
        function calculateDistance(lat1, lon1, lat2, lon2) {

            const R = 6371000;

            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;

            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a =
                Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

            const c =
                2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {

    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const y = Math.sin(Δλ) * Math.cos(φ2);

    const x =
        Math.cos(φ1) * Math.sin(φ2) -
        Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);

    const bearing =
        Math.atan2(y, x) * 180 / Math.PI;

    return (bearing + 360) % 360;
}

        // Aktualizuje vzdálenost z telefonu k cíli
        function updateDistance(latitude, longitude) {

    const distance = calculateDistance(
        latitude,
        longitude,
        target.latitude,
        target.longitude
    );

    const bearing = calculateBearing(
        latitude,
        longitude,
        target.latitude,
        target.longitude
    );
            currentBearing = bearing;
updateArrow();

    document.getElementById("distance").textContent =
        Math.round(distance);

    document.getElementById("bearing").textContent =
        Math.round(bearing);

    navigation.style.display = "block";
}

        function startCompass() {

    if (typeof DeviceOrientationEvent === "undefined") {
        document.getElementById("heading").textContent =
            "nepodporováno";
        return;
    }

    // iPhone / iPad – vyžaduje explicitní povolení
    if (typeof DeviceOrientationEvent.requestPermission === "function") {

        DeviceOrientationEvent.requestPermission()
            .then(function(permissionState) {

                if (permissionState === "granted") {
                    window.addEventListener(
                        "deviceorientation",
                        handleOrientation,
                        true
                    );
                }

            })
            .catch(console.error);

    } else {

        // Android a zařízení, která zvláštní povolení nepotřebují
        window.addEventListener(
            "deviceorientationabsolute",
            handleOrientation,
            true
        );

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );
    }
}

function handleOrientation(event) {

    let heading;

    // Safari na iPhone
    if (event.webkitCompassHeading !== undefined) {

        heading = event.webkitCompassHeading;

    // Android / ostatní
    } else if (event.alpha !== null) {

        heading = 360 - event.alpha;

    } else {
        return;
    }

    heading = (heading + 360) % 360;
    currentHeading = heading;
updateArrow();

    const roundedHeading = 
        (Math.round(heading / 5) * 5) % 360;

document.getElementById("heading").textContent =
    roundedHeading;
}


// OTÁČENÍ ŠIPKY
function updateArrow() {

    if (currentBearing === null || currentHeading === null) {
        return;
    }

    let rotation = currentBearing - currentHeading;

    rotation = (rotation + 360) % 360;

    document.getElementById("arrow").style.transform =
        `rotate(${rotation}deg)`;
}
        
        function positionError(error) {

            if (error.code === 1) {
                status.textContent =
                    "Přístup k poloze nebyl povolen.";

            } else if (error.code === 2) {
                status.textContent =
                    "Polohu se nepodařilo zjistit.";

            } else if (error.code === 3) {
                status.textContent =
                    "Zjišťování polohy trvalo příliš dlouho.";

            } else {
                status.textContent =
                    "Nastala chyba GPS.";
            }
        }

    </script>

</body>
</html>
